        link_text: Confirmar mi dirección
      password_changed_instructions:
        hello: Hola %{name},
        subject: 'Tu contraseña ha sido cambiada en %{site_name}'
        text: Nosotros te estamos contactando para notificarte que tu contraseña ha sido cambiada.
      reset_password_instructions:
        hello: Hola %{name},
        subject: 'Instrucciones para restablecer tu contraseña en %{site_name}'
        instructions: Alguien ha solicitado un enlace para cambiar tu contraseña. Puedes hacerlo a través del enlace a continuación.
        link_text: Cambiar mi contraseña
        if_not_you: Si no solicitó esto, por favor ignore este correo electrónico.
        no_change: Su contraseña no cambiará a menos que haga clic en el enlace de arriba y cree una nueva.
      email_changed_instructions:
        hello: Hola %{name},
        subject: 'Cambiar la dirección de correo electrónico en %{site_name}'
        email_changing: Nos estamos poniendo en contacto con usted para notificarle que su correo electrónico está siendo cambiado a
        email_changed: Nos estamos poniendo en contacto con usted para notificarle que su correo electrónico ha sido cambiado a
