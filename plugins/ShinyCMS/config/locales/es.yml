    do_not_contact:
      new:
        title: Lista de no contactar
        heading: Agregar una dirección de correo electrónico a nuestra lista de no contactar
        explanation: |
          Si prefiere nunca recibir correo electrónico de nosotros, ingrese su dirección de correo electrónico a continuación.
          Se guardará en forma cifrada en nuestra base de datos, en una lista que se verifica antes de
          cada correo electrónico que se envía desde este sitio. Si se encuentra una coincidencia, el correo electrónico no se envía.
      create:
        success: Su dirección de correo electrónico ha sido agregada a nuestra lista de no contactar
